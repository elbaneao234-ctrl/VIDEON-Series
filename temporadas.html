<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporadas | VIDEON</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="index.html">VIDEON</a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" aria-current="page">Catálogos</a>
            <a href="index.html#sobre">Sobre nosotros</a>
        </nav>
        <div id="auth-status" class="auth-status" aria-live="polite"></div>
    </header>

    <main class="catalog-page">
        <section class="catalog-header">
            <a class="back-link" href="catalogo.html">← Volver a catálogos</a>
            <p class="hero-subtitle" id="catalog-label">CATÁLOGO</p>
            <h1 id="catalog-title">Temporadas</h1>
            <p class="hero-description" id="catalog-description">Elige una temporada para ver sus vídeos.</p>
        </section>

        <section class="videos-section" aria-labelledby="season-title">
            <div class="section-header">
                <p>COLECCIÓN</p>
                <h2 id="season-title">Temporadas</h2>
            </div>
            <div class="catalog-grid" id="season-grid"></div>
        </section>
    </main>

    <div id="auth-modal" class="auth-modal" aria-hidden="true">
        <div class="auth-modal-content" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
            <button class="close-modal" type="button" data-auth-close aria-label="Cerrar inicio de sesión">×</button>
            <p class="hero-subtitle">CUENTA</p>
            <h3 id="auth-modal-title">Iniciar sesión</h3>
            <form id="auth-form" data-mode="login">
                <input id="auth-email" type="email" placeholder="Correo electrónico" required>
                <input id="auth-password" type="password" placeholder="Contraseña" required>
                <input type="hidden" id="auth-mode" value="login">
                <button id="auth-submit" class="auth-button primary" type="submit">Entrar</button>
            </form>
            <button id="auth-toggle" class="auth-toggle" type="button">¿No tienes cuenta?</button>
        </div>
    </div>

    <footer>
        <p>© 2026 VIDEON</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="database.js"></script>
    <script src="progress.js"></script>
    <script src="script.js"></script>
</body>

</html>
